<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" font-family="sans-serif">

  <rect width="660" height="280" fill="white"/>

  <!--
    Grid: 9x9 cells, each 28x28, origin at (0,0) within each panel group.
    Center of grid = cell (4,4), center pixel = (126, 126).
    Buffer circle: cx=126, cy=126, r=56.

    Cell centers (col c, row r): x = c*28 + 14, y = r*28 + 14
    Distance from (126,126) to cell center:
      (0,0)=14,14  → d=158.4   (4,4)=126,126 → d=0

    touches=FALSE: cell center inside circle (distance < 56)
    touches=TRUE: any part of cell overlaps circle
      (nearest point of cell rect to circle center < 56)

    Cells whose CENTER is within r=56 of (126,126):
      Center cells at dist:
      (4,4)=0, (3,4)=28, (5,4)=28, (4,3)=28, (4,5)=28,
      (3,3)=39.6, (5,3)=39.6, (3,5)=39.6, (5,5)=39.6,
      (2,4)=56 → exactly on boundary, include
      (6,4)=56 → include
      (4,2)=56 → include
      (4,6)=56 → include
      (2,3)=47.5 → include
      (6,3)=47.5 → include
      (2,5)=47.5 → include
      (6,5)=47.5 → include
      Total FALSE: 17 cells (diamond/circle shape)

    Cells TOUCHED by circle (nearest rect edge < 56):
      All of the above PLUS cells whose nearest corner/edge is within 56.
      Additional touched cells:
      (1,3): nearest pt (28,84), dist to (126,126)=sqrt(98^2+42^2)=107 → NO
      Actually let me be more careful.
      Cell (c,r) spans x=[c*28, c*28+28], y=[r*28, r*28+28].
      Nearest point of rect to (126,126): clamp(126, x0, x1), clamp(126, y0, y1).

      (1,4): x=[28,56], y=[112,140]. nearest=(56,126). dist=70 → NO
      (7,4): x=[196,224], y=[112,140]. nearest=(196,126). dist=70 → NO
      (4,1): x=[112,140], y=[28,56]. nearest=(126,56). dist=70 → NO
      (4,7): x=[112,140], y=[196,224]. nearest=(126,196). dist=70 → NO

      (1,3): x=[28,56], y=[84,112]. nearest=(56,112). dist=sqrt(70^2+14^2)=71.4 → NO
      (2,2): x=[56,84], y=[56,84]. nearest=(84,84). dist=sqrt(42^2+42^2)=59.4 → NO
      (6,2): x=[168,196], y=[56,84]. nearest=(168,84). dist=sqrt(42^2+42^2)=59.4 → NO
      (2,6): x=[56,84], y=[168,196]. nearest=(84,168). dist=59.4 → NO
      (6,6): x=[168,196], y=[168,196]. nearest=(168,168). dist=59.4 → NO

      (3,2): x=[84,112], y=[56,84]. nearest=(112,84). dist=sqrt(14^2+42^2)=44.3 → YES
      (5,2): x=[140,168], y=[56,84]. nearest=(140,84). dist=sqrt(14^2+42^2)=44.3 → YES
      (3,6): x=[84,112], y=[168,196]. nearest=(112,168). dist=44.3 → YES
      (5,6): x=[140,168], y=[168,196]. nearest=(140,168). dist=44.3 → YES
      (1,4): already checked, 70 → NO
      (7,3): x=[196,224], y=[84,112]. nearest=(196,112). dist=sqrt(70^2+14^2)=71.4 → NO

      So touches=TRUE adds: (3,2), (5,2), (3,6), (5,6) → 4 additional = 21 total
  -->

